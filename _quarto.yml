project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "cours/*/index.qmd"
    - "cours/*/diapositives.qmd"
    - "examens/consignes.qmd"
    - "examens/*/index.qmd"
    - "cours/*/guide.qmd"
    - "examens/*/guide.qmd"
  resources:
    - documents/**

website:
  title: "PSY1703 — Psychologie sociale"
  favicon: assets/favicon.svg
  site-url: "https://rempsyc.github.io/psy1703/"
  repo-url: "https://github.com/rempsyc/psy1703"
  repo-actions: [source]
  navbar:
    background: "#123b5d"
    left:
      - text: "Accueil"
        href: index.qmd
      - text: "Calendrier"
        href: calendrier.qmd
      - text: "Plan de cours"
        href: plan-de-cours.qmd
      - text: "Examens"
        menu:
          - text: "Examen 1"
            href: examens/01/index.qmd
          - text: "Examen 2"
            href: examens/02/index.qmd
          - text: "Examen 3"
            href: examens/03/index.qmd
  sidebar:
    style: docked
    search: true
    contents:
      - index.qmd
      - calendrier.qmd
      - plan-de-cours.qmd
      - section: "Séances"
        contents:
          - text: "1 · Introduction"
            href: cours/01/index.qmd
          - text: "2 · Méthodes de recherche"
            href: cours/02/index.qmd
          - text: "3 · Le soi"
            href: cours/03/index.qmd
          - text: "4 · Les cognitions sociales"
            href: cours/04/index.qmd
          - text: "Examen 1 — 29 septembre"
            href: examens/01/index.qmd
          - text: "5 · L’attribution"
            href: cours/05/index.qmd
          - text: "Examen 2 — 10 novembre"
            href: examens/02/index.qmd
          - text: "Examen 3 — 15 décembre"
            href: examens/03/index.qmd
  page-footer:
    left: "PSY1703-04 · UQAR · Automne 2026"
    right: "Matériel évolutif — vérifiez la date de mise à jour."

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    lang: fr-CA

execute:
  freeze: auto
